name: Build Shivam Payroll APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o ShivamPayroll_Mobile_CloudBuild_Logo.zip
          cd ShivamPayrollCloudBuild
          
                 echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Payroll-APK
          path: ShivamPayrollCloudBuild/app/build/outputs/apk/debug/app-debug.apk
